name: MLOps CI-CT-CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      training_batch:
        description: "Lote de datos para reentrenamiento (Mantenimiento MLOps)"
        required: true
        default: "data/splits/train_v2.csv"
        type: choice
        options:
          - data/splits/train_v1.csv
          - data/splits/train_v2.csv
          - data/splits/train_bad.csv

permissions:
  contents: write

jobs:
  ci_and_mlops:
    name: CI Tests & Automated Model Maintenance
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Install dependencies
        run: pip install -r requirements.txt

      - name: 4. Run Continuous Training (CT) & Promotion Gate
        run: |
          BATCH="${{ github.event.inputs.training_batch || 'data/splits/train_current.csv' }}"
          echo "Entrenando y evaluando con el lote: $BATCH"
          python -m src.train --train "$BATCH"

      - name: 5. Run Continuous Integration (CI) Unit & Quality Tests
        run: pytest -v

      - name: 6. Commit updated Champion Model to Production (CD)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/
          git diff --staged --quiet || (git commit -m "MLOps CD: Update Champion model and registry" && git push)